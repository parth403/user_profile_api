services:
  app:
    build: .
    image: parth0841/my-app1
    ports: 
      - "8000:8000"
      
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: